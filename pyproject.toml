[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icsee-local-ptz"
version = "0.1.0"
description = "Local ONVIF/DVRIP diagnostics and bounded iCSee PTZ control"
requires-python = ">=3.10"
dependencies = ["onvif-python==0.4.7", "fastapi==0.162.0", "uvicorn==0.54.0", "websockets==17.3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx==0.28.1"]

[project.scripts]
icsee-ptz = "icsee_ptz.__main__:main"

[tool.setuptools.packages.find]
include = ["icsee_ptz*"]

[tool.setuptools.package-data]
icsee_ptz = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
